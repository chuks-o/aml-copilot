name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run lint
      - run: make lint-api
      - run: pnpm --dir web run typecheck
      - run: pnpm --dir web run test
      - run: pnpm --dir web run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: backend
          enable-cache: true
      - run: make -C backend install
      - run: make -C backend lint
      - run: make -C backend typecheck
      - run: make -C backend test

  codegen:
    # Fails if backend/openapi.yaml or the GraphQL schema/operations changed without
    # `make codegen` and a commit of the output (decision 0018).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: backend
          enable-cache: true
      - run: make install
      - run: make codegen-check
